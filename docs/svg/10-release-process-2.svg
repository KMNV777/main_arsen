<text x="25" y="153.5" font-size="12" fill="#140093" text-anchor="start" font-weight="bold">(репозиторий</text>
<text x="25" y="168.5" font-size="12" fill="#140093" text-anchor="start" font-weight="bold">сервиса)</text>
<ellipse cx="230" cy="160" rx="5" ry="5" fill="#140093" stroke="#140093" stroke-width="1"/>
