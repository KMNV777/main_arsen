<ellipse cx="1240" cy="400" rx="5" ry="5" fill="#019390" stroke="#019390" stroke-width="1"/>
<rect x="1366" y="382" width="8" height="36" fill="#D64545" stroke="#D64545" stroke-width="1"/>
<ellipse cx="2071" cy="400" rx="15" ry="15" fill="#CFF85E" stroke="#140093" stroke-width="2"/>
<text x="2071" y="401.5" font-size="8" fill="#1B1B3A" text-anchor="middle" font-weight="bold">Прод</text>
<text x="855" y="376" font-size="11" fill="#019390" text-anchor="start" font-weight="bold">release/&lt;сервис&gt;/N+1</text>
<ellipse cx="1410" cy="550" rx="8" ry="8" fill="#FFFFFF" stroke="#4895EB" stroke-width="2"/>
<ellipse cx="1540" cy="550" rx="5" ry="5" fill="#4895EB" stroke="#4895EB" stroke-width="1"/>
<ellipse cx="1640" cy="550" rx="5" ry="5" fill="#4895EB" stroke="#4895EB" stroke-width="1"/>
<ellipse cx="1740" cy="550" rx="5" ry="5" fill="#4895EB" stroke="#4895EB" stroke-width="1"/>
<ellipse cx="1840" cy="550" rx="5" ry="5" fill="#4895EB" stroke="#4895EB" stroke-width="1"/>
<rect x="1966" y="532" width="8" height="36" fill="#D64545" stroke="#D64545" stroke-width="1"/>
<ellipse cx="2171" cy="550" rx="15" ry="15" fill="#CFF85E" stroke="#140093" stroke-width="2"/>
<text x="2171" y="551.5" font-size="8" fill="#1B1B3A" text-anchor="middle" font-weight="bold">Прод</text>
<text x="1455" y="526" font-size="11" fill="#4895EB" text-anchor="start" font-weight="bold">release/&lt;сервис&gt;/N+2</text>
<text x="190" y="283" font-size="9" fill="#1B1B3A" text-anchor="start">старт спринта: сбор</text>
<text x="190" y="295" font-size="9" fill="#1B1B3A" text-anchor="start">ветки</text>
<text x="305" y="283" font-size="9" fill="#1B1B3A" text-anchor="start">влитие задач</text>
<text x="485" y="283" font-size="9" fill="#1B1B3A" text-anchor="start">тестирование и демо (QA · ВНП)</text>
<text x="695" y="203" font-size="9" fill="#D64545" text-anchor="start" font-weight="bold">фича-фриз</text>
<text x="695" y="215" font-size="9" fill="#D64545" text-anchor="start" font-weight="bold">(конец спринта)</text>
<text x="805" y="275" font-size="9" fill="#1B1B3A" text-anchor="start">стабилизация и выкат: регресс UAT → устранение → Smoke UAT → релиз-борд → PreProd → деплой в Прод</text>
<text x="813" y="316" font-size="10" fill="#B85500" text-anchor="start" font-weight="bold">не принято и не успели →</text>
<text x="813" y="329" font-size="10" fill="#B85500" text-anchor="start" font-weight="bold">следующий релиз (= следующий спринт)</text>
<text x="1413" y="466" font-size="10" fill="#B85500" text-anchor="start" font-weight="bold">не принято и не успели →</text>
<text x="1413" y="479" font-size="10" fill="#B85500" text-anchor="start" font-weight="bold">следующий релиз (= следующий спринт)</text>
<text x="1655" y="589.5" font-size="10" fill="#D64545" text-anchor="start" font-weight="bold">hotfix/* — от ветки Прода; тот же процесс</text>
<text x="185" y="638" font-size="11" fill="#140093" text-anchor="start" font-weight="bold">Допускается вести несколько релизных веток параллельно: ветка N+1 создаётся на старте следующего спринта, пока ветка N проходит стабилизацию и выкат.</text>
<text x="185" y="667.5" font-size="10" fill="#1B1B3A" text-anchor="start">Соответствие этапам схемы 1:  3 — сбор ветки · 4 — влитие задач · 5 — тестирование · 6 — демо и приёмка · 7 — фича-фриз · 8–14 — стабилизация на UAT · 15–19 — релиз-борд · 20–25 — PreProd · 27 — деплой в Прод</text>
<rect x="20" y="700" width="220" height="24" fill="#140093" stroke="#140093" stroke-width="1"/>
<text x="25" y="715" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="bold">Шаг</text>
<rect x="240" y="700" width="1700" height="24" fill="#140093" stroke="#140093" stroke-width="1"/>
<text x="245" y="715" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="bold">Правило</text>
<rect x="20" y="724" width="220" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="25" y="739" font-size="11" fill="#1B1B3A" text-anchor="start">Старт спринта</text>
<rect x="240" y="724" width="1700" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="245" y="739" font-size="11" fill="#1B1B3A" text-anchor="start">В первый день спринта релиз-инженер НЕДРА вместе с мейнтейнерами создаёт релизную ветку каждого сервиса от master. Имя: release/&lt;сервис&gt;/&lt;версия&gt;.</text>
<rect x="20" y="748" width="220" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="25" y="763" font-size="11" fill="#1B1B3A" text-anchor="start">Влитие задач</text>
<rect x="240" y="748" width="1700" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="245" y="763" font-size="11" fill="#1B1B3A" text-anchor="start">Только Story и Bug из релизного тикета: с оценкой, тест-кейсами, кодовым инкрементом (PR со ссылкой на ключ Story) и скриптами миграции.</text>
<rect x="20" y="772" width="220" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="25" y="787" font-size="11" fill="#1B1B3A" text-anchor="start">Тестирование и демо</text>
<rect x="240" y="772" width="1700" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="245" y="787" font-size="11" fill="#1B1B3A" text-anchor="start">QA тестирует влитые задачи и проводит демо, ВНП принимает. Не принятые задачи остаются в разработке.</text>
<rect x="20" y="796" width="220" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="25" y="811" font-size="11" fill="#1B1B3A" text-anchor="start">Фича-фриз</text>
<rect x="240" y="796" width="1700" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="245" y="811" font-size="11" fill="#1B1B3A" text-anchor="start">В последний день спринта ветка замораживается. Новые задачи не принимаются; не успевшие и не принятые — в следующий релиз = следующий спринт.</text>
<rect x="20" y="820" width="220" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="25" y="835" font-size="11" fill="#1B1B3A" text-anchor="start">Параллельные ветки</text>
<rect x="240" y="820" width="1700" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="245" y="835" font-size="11" fill="#1B1B3A" text-anchor="start">Допускается несколько релизных веток одновременно: ветка следующего релиза создаётся на старте следующего спринта, пока предыдущая проходит стабилизацию и выкат.</text>
<rect x="20" y="844" width="220" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="25" y="859" font-size="11" fill="#1B1B3A" text-anchor="start">Исправления в ветке</text>
<rect x="240" y="844" width="1700" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="245" y="859" font-size="11" fill="#1B1B3A" text-anchor="start">После фриза вливаются только исправления багов и уязвимостей этапа «Устранение багов и уязвимостей». Этап заканчивается код-фризом.</text>
<rect x="20" y="868" width="220" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="25" y="883" font-size="11" fill="#1B1B3A" text-anchor="start">Hotfix</text>
<rect x="240" y="868" width="1700" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="245" y="883" font-size="11" fill="#1B1B3A" text-anchor="start">Критические дефекты после PreProd включаются в hotfix: ветка hotfix/* от ветки Прода, тот же процесс.</text>
<rect x="20" y="892" width="220" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="25" y="907" font-size="11" fill="#1B1B3A" text-anchor="start">После выката</text>
<rect x="240" y="892" width="1700" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="245" y="907" font-size="11" fill="#1B1B3A" text-anchor="start">Релизная ветка закрывается; слияние в master — техническая операция команды разработки вне этапов процесса.</text>
