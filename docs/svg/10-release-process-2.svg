<ellipse cx="1210" cy="160" rx="5" ry="5" fill="#140093" stroke="#140093" stroke-width="1"/>
<ellipse cx="1280" cy="160" rx="5" ry="5" fill="#140093" stroke="#140093" stroke-width="1"/>
<ellipse cx="1350" cy="160" rx="5" ry="5" fill="#140093" stroke="#140093" stroke-width="1"/>
<ellipse cx="1420" cy="160" rx="5" ry="5" fill="#140093" stroke="#140093" stroke-width="1"/>
<ellipse cx="1490" cy="160" rx="5" ry="5" fill="#140093" stroke="#140093" stroke-width="1"/>
<ellipse cx="1560" cy="160" rx="5" ry="5" fill="#140093" stroke="#140093" stroke-width="1"/>
<ellipse cx="1630" cy="160" rx="5" ry="5" fill="#140093" stroke="#140093" stroke-width="1"/>
<ellipse cx="1700" cy="160" rx="5" ry="5" fill="#140093" stroke="#140093" stroke-width="1"/>
<ellipse cx="1770" cy="160" rx="5" ry="5" fill="#140093" stroke="#140093" stroke-width="1"/>
<ellipse cx="1840" cy="160" rx="5" ry="5" fill="#140093" stroke="#140093" stroke-width="1"/>
<ellipse cx="1910" cy="160" rx="5" ry="5" fill="#140093" stroke="#140093" stroke-width="1"/>
<ellipse cx="1980" cy="160" rx="5" ry="5" fill="#140093" stroke="#140093" stroke-width="1"/>
<ellipse cx="2050" cy="160" rx="5" ry="5" fill="#140093" stroke="#140093" stroke-width="1"/>
<text x="190" y="182" font-size="9" fill="#1B1B3A" text-anchor="start">PR с ревью; незавершённое — за feature flag</text>
<rect x="520" y="250" width="250" height="44" rx="8" fill="#FFE9D2" stroke="#FF7500" stroke-width="1.5"/>
<text x="645" y="268" font-size="9" fill="#1B1B3A" text-anchor="middle" font-weight="bold">Не принято на демо → вывод из релиза</text>
<text x="645" y="280" font-size="7" fill="#666666" text-anchor="middle">revert PR / отключение флага</text>
<rect x="771" y="136" width="8" height="48" fill="#D64545" stroke="#D64545" stroke-width="1"/>
<text x="780" y="107" font-size="9" fill="#D64545" text-anchor="middle" font-weight="bold">тег EARM-N</text>
<text x="780" y="119" font-size="9" fill="#D64545" text-anchor="middle" font-weight="bold">фича-фриз (релиз-кандидат)</text>
<text x="795" y="323" font-size="9" fill="#1B1B3A" text-anchor="start">стабилизация N: регресс UAT → фиксы (в master или в ветку от тега) → итоговый тег (код-фриз) → релиз-борд → PreProd → Прод</text>
<rect x="1176" y="136" width="8" height="48" fill="#019390" stroke="#019390" stroke-width="1"/>
<text x="1185" y="107" font-size="9" fill="#019390" text-anchor="middle" font-weight="bold">тег EARM-N (код-фриз)</text>
<text x="1185" y="119" font-size="9" fill="#019390" text-anchor="middle" font-weight="bold">берёт релиз-борд</text>
<ellipse cx="1267" cy="160" rx="17" ry="17" fill="#CFF85E" stroke="#140093" stroke-width="2"/>
<text x="1267" y="161.5" font-size="8" fill="#1B1B3A" text-anchor="middle" font-weight="bold">Прод</text>
<rect x="1371" y="136" width="8" height="48" fill="#D64545" stroke="#D64545" stroke-width="1"/>
<text x="1380" y="107" font-size="9" fill="#D64545" text-anchor="middle" font-weight="bold">тег EARM-N+1</text>
<text x="1380" y="119" font-size="9" fill="#D64545" text-anchor="middle" font-weight="bold">фича-фриз</text>
<text x="1395" y="403" font-size="9" fill="#1B1B3A" text-anchor="start">стабилизация N+1; новые фичи спринта N+2 вливаются в master за флагом</text>
<rect x="1776" y="136" width="8" height="48" fill="#019390" stroke="#019390" stroke-width="1"/>
<text x="1785" y="107" font-size="9" fill="#019390" text-anchor="middle" font-weight="bold">тег EARM-N+1</text>
<text x="1785" y="119" font-size="9" fill="#019390" text-anchor="middle" font-weight="bold">(код-фриз)</text>
<rect x="1971" y="136" width="8" height="48" fill="#D64545" stroke="#D64545" stroke-width="1"/>
<text x="1980" y="107" font-size="9" fill="#D64545" text-anchor="middle" font-weight="bold">тег EARM-N+2</text>
<text x="1980" y="119" font-size="9" fill="#D64545" text-anchor="middle" font-weight="bold">фича-фриз</text>
<ellipse cx="480" cy="480" rx="5" ry="5" fill="#904EE2" stroke="#904EE2" stroke-width="1"/>
<ellipse cx="620" cy="480" rx="5" ry="5" fill="#904EE2" stroke="#904EE2" stroke-width="1"/>
<ellipse cx="760" cy="480" rx="5" ry="5" fill="#904EE2" stroke="#904EE2" stroke-width="1"/>
<ellipse cx="900" cy="480" rx="5" ry="5" fill="#904EE2" stroke="#904EE2" stroke-width="1"/>
<text x="350" y="509.5" font-size="10" fill="#904EE2" text-anchor="start" font-weight="bold">супер-фича-ветка (опционально): PR с ревью как обычно → пакет правок тестируется целиком</text>
<text x="1051" y="471" font-size="9" fill="#904EE2" text-anchor="start">merge в master после приёмки;</text>
<text x="1051" y="483" font-size="9" fill="#904EE2" text-anchor="start">не принято → ветка не вливается</text>
<ellipse cx="1601" cy="600" rx="6" ry="6" fill="#D64545" stroke="#D64545" stroke-width="1"/>
<text x="1310" y="623" font-size="9" fill="#D64545" text-anchor="start" font-weight="bold">hotfix (ускоренная полоса): исправление в master; если master ушёл вперёд — cherry-pick в короткоживущую ветку от</text>
<text x="1310" y="635" font-size="9" fill="#D64545" text-anchor="start" font-weight="bold">тега Прода и новый тег</text>
<text x="185" y="672.5" font-size="10" fill="#140093" text-anchor="start" font-weight="bold">Сервисы живут в отдельных репозиториях: один и тот же ID релиза (Fix Version) ставится тегом в репозиториях всех сервисов релиза. Отдельных release-веток нет — нет и backport между ними.</text>
<text x="185" y="696.5" font-size="10" fill="#1B1B3A" text-anchor="start">Соответствие этапам схемы 1: 5 — разработка и влитие в master · 9 — демо · 10 — вывод не принятых задач · 11 — фича-фриз и тег · 12–17 — стабилизация, фиксы в master · 31 — деплой в Прод.</text>
<rect x="20" y="730" width="260" height="24" fill="#140093" stroke="#140093" stroke-width="1"/>
<text x="25" y="745" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="bold">Тема</text>
<rect x="280" y="730" width="1660" height="24" fill="#140093" stroke="#140093" stroke-width="1"/>
<text x="285" y="745" font-size="11" fill="#FFFFFF" text-anchor="start" font-weight="bold">Правило</text>
<rect x="20" y="754" width="260" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="25" y="769" font-size="11" fill="#1B1B3A" text-anchor="start">Репозитории</text>
<rect x="280" y="754" width="1660" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="285" y="769" font-size="11" fill="#1B1B3A" text-anchor="start">Каждый сервис живёт в своём репозитории; релиз — это один и тот же ID (Fix Version, например EARM26.4.1) как git-тег в репозитории каждого сервиса релиза.</text>
<rect x="20" y="778" width="260" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="25" y="793" font-size="11" fill="#1B1B3A" text-anchor="start">master</text>
<rect x="280" y="778" width="1660" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="285" y="793" font-size="11" fill="#1B1B3A" text-anchor="start">Единая основная ветка. Все изменения — через PR с ревью (ссылка на ключ Story, кодовый инкремент, скрипты миграции). Незавершённое и рискованное — за feature flag.</text>
<rect x="20" y="802" width="260" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="25" y="817" font-size="11" fill="#1B1B3A" text-anchor="start">Супер-фича-ветка (опционально)</text>
<rect x="280" y="802" width="1660" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="285" y="817" font-size="11" fill="#1B1B3A" text-anchor="start">Для сложной фичи заводится агрегирующая ветка: PR направляются в неё как обычно, с ревью; весь пакет правок тестируется вместе и вливается в master после приёмки.</text>
<rect x="20" y="826" width="260" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="25" y="841" font-size="11" fill="#1B1B3A" text-anchor="start">Не принято на демо</text>
<rect x="280" y="826" width="1660" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="285" y="841" font-size="11" fill="#1B1B3A" text-anchor="start">До тега задача выводится из релиза: revert PR, отключение флага или невлитая супер-фича-ветка. Задача переходит в следующий релиз.</text>
<rect x="20" y="850" width="260" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="25" y="865" font-size="11" fill="#1B1B3A" text-anchor="start">Фича-фриз и тег</text>
<rect x="280" y="850" width="1660" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="285" y="865" font-size="11" fill="#1B1B3A" text-anchor="start">В последний день спринта на коммит master ставится тег с ID релиза (релиз-кандидат). Новые фичи следующего спринта вливаются за флагом.</text>
<rect x="20" y="874" width="260" height="38" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="25" y="896" font-size="11" fill="#1B1B3A" text-anchor="start">Исправления стабилизации</text>
<rect x="280" y="874" width="1660" height="38" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="285" y="889" font-size="11" fill="#1B1B3A" text-anchor="start">Баги регресса и блокирующие уязвимости правятся в master и фиксируются новым тегом; если в master уже есть изменения следующего спринта (миграции, зависимости, конфиги), фикс идёт в короткоживущую ветку от тега релиза, которая живёт до деплоя. Итоговый тег —</text>
<text x="285" y="903" font-size="11" fill="#1B1B3A" text-anchor="start">код-фриз, его берёт релиз-борд.</text>
<rect x="20" y="912" width="260" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="25" y="927" font-size="11" fill="#1B1B3A" text-anchor="start">Защита тегов и образов</text>
<rect x="280" y="912" width="1660" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="285" y="927" font-size="11" fill="#1B1B3A" text-anchor="start">Теги релизов — protected (переставить нельзя); digest образа фиксируется в TOML и проверяется при согласовании трансфера. Миграции БД — обратно совместимые (expand/contract), чтобы код следующего спринта в master не ломал релиз.</text>
<rect x="20" y="936" width="260" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="25" y="951" font-size="11" fill="#1B1B3A" text-anchor="start">Hotfix</text>
<rect x="280" y="936" width="1660" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="285" y="951" font-size="11" fill="#1B1B3A" text-anchor="start">Критический дефект: исправление в master; если master ушёл вперёд — cherry-pick в короткоживущую ветку от тега Прода и новый тег. Идёт по ускоренной полосе hotfix (см. «Контроль релиза и риски»).</text>
<rect x="20" y="960" width="260" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="25" y="975" font-size="11" fill="#1B1B3A" text-anchor="start">Параллельные релизы</text>
<rect x="280" y="960" width="1660" height="24" fill="#FFFFFF" stroke="#B0B0B0" stroke-width="1"/>
<text x="285" y="975" font-size="11" fill="#1B1B3A" text-anchor="start">Релизы различаются тегами, а не ветками: следующий релиз стартует, пока предыдущий в стабилизации, без отдельных release-веток и backport.</text>
