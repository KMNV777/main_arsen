<polyline points="1375,186 1375,380 1700,380" fill="none" stroke="#FF7500" stroke-width="2" stroke-dasharray="6 3"/>
<polyline points="300,164 340,480 1000,480" fill="none" stroke="#904EE2" stroke-width="3.5"/>
<polyline points="1000,480 1040,166" fill="none" stroke="#904EE2" stroke-width="3.5" marker-end="url(#m1)"/>
<polyline points="1262,180 1300,600 1600,600" fill="none" stroke="#D64545" stroke-width="3"/>
