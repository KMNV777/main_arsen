<rect x="10" y="6" width="2180" height="34" fill="#FFFFFF" stroke="#666666" stroke-width="1"/>
<text x="15" y="28" font-size="15" fill="#140093" text-anchor="start" font-weight="bold">Процесс выпуска релиза ЕАРМ · Сервис: ⟨СЕРВИС⟩ · Направление: ⟨ЕАРМ1–6⟩ · Релиз: ⟨27.x.y⟩   |   ведение релизных веток: от старта спринта до фича-фриза</text>
<rect x="180" y="56" width="600" height="34" fill="#140093" stroke="#FFFFFF" stroke-width="1"/>
<text x="480" y="76.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Спринт N · 2 недели</text>
<rect x="180" y="90" width="600" height="520" fill="#ECEAF9" stroke="#C9D2E6" stroke-width="1"/>
<rect x="780" y="56" width="600" height="34" fill="#140093" stroke="#FFFFFF" stroke-width="1"/>
<text x="1080" y="76.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Спринт N+1 · 2 недели</text>
<rect x="780" y="90" width="600" height="520" fill="#F4F6FB" stroke="#C9D2E6" stroke-width="1"/>
<rect x="1380" y="56" width="600" height="34" fill="#140093" stroke="#FFFFFF" stroke-width="1"/>
<text x="1680" y="76.5" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Спринт N+2 · 2 недели</text>
<rect x="1380" y="90" width="600" height="520" fill="#ECEAF9" stroke="#C9D2E6" stroke-width="1"/>
<text x="25" y="142" font-size="13" fill="#140093" text-anchor="start" font-weight="bold">master</text>
